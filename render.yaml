services:
  - type: web
    name: spacejam-miniapp
    runtime: python
    plan: starter
    region: frankfurt
    disk:
      name: spacejam-data
      mountPath: /var/data/spacejam
      sizeGB: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: RUN_BOT
        value: "1"
      - key: RUN_WEB
        value: "1"
      - key: MINI_APP_DEV_MODE
        value: "0"
      - key: SPACEJAM_DATA_DIR
        value: /var/data/spacejam
